name: reVC Windows amd64 (D3D9) for CrossOver

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      PLATFORM: win-amd64-librw_d3d9-oal
      CONFIG: Release
    steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Generate Visual Studio solution
      run: .\premake5.exe vs2019 --with-librw

    - name: Build reVC
      run: >
        msbuild -m build/reVC.sln
        /p:Configuration=${{ env.CONFIG }}
        /p:Platform=${{ env.PLATFORM }}
        /p:PlatformToolset=v143

    - name: Assemble CrossOver package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        # Engine data files (NOT the copyrighted game assets)
        Copy-Item -Recurse -Force gamefiles/* dist/
        # The freshly built executable
        Copy-Item -Force "bin/$env:PLATFORM/$env:CONFIG/reVC.exe" dist/
        # Runtime DLLs (OpenAL audio + mp3 decoder), committed in vendor/
        Copy-Item -Force vendor/openal-soft/dist/Win64/OpenAL32.dll dist/
        Copy-Item -Force vendor/mpg123/dist/Win64/libmpg123-0.dll dist/
        Get-ChildItem -Recurse dist | Select-Object FullName

    - name: Upload reVC package
      uses: actions/upload-artifact@v4
      with:
        name: reVC_Release_win-amd64-d3d9-oal
        path: dist/*
        if-no-files-found: error
